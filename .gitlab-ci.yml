---
stages:
  - install
  - build
  - publish

include:
  - project: devops/pipelines
    ref: go@2.2.2
    file:
      - /go/install.gitlab-ci.yml
      - /go/lint.gitlab-ci.yml
      - /go/build.gitlab-ci.yml
      - /go/test.gitlab-ci.yml
    inputs:
      version: 1.27-alpine
  - project: devops/pipelines
    ref: semantic-release@3.0.0
    file:
      - /semantic-release/publish.gitlab-ci.yml
  - project: devops/pipelines
    ref: references@1.5.0
    file: /references/workflow.gitlab-ci.yml

install:
  stage: install
  extends:
    - .go-install

lint:
  stage: build
  extends:
    - .go-lint

test:
  stage: build
  extends:
    - .go-test

build:
  stage: build
  extends:
    - .go-build

publish:
  stage: publish
  extends:
    - .semantic-release
  dependencies: []
